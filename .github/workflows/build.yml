name: Build and Release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            friendly_name: Linux
          - os: windows-latest
            friendly_name: Windows
          - os: macos-latest
            friendly_name: macOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r req.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pip uninstall -y pathlib
          pyinstaller --onefile fluid.py --name fluid --clean --noconfirm

      - name: Pack artifact
        shell: bash
        run: |
          cd dist
          python -m zipfile -c ../Fluid-${{ matrix.friendly_name }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: Fluid-${{ matrix.friendly_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build${{ github.run_number }}
          name: Build n${{ github.run_number }}
          draft: true
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
